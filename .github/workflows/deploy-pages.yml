name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let i = 0; i < 30; i++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (data.artifacts.some((a) => a.name === name)) {
                core.info(`Artifact ${name} is available`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            core.setFailed(`Artifact ${name} was not available after 60s`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
