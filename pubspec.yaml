name: galingo
description: "Galingo — App de aprendizaxe do galego A1-A2. TFM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local Persistence
  hive_flutter: ^1.1.0

  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Typography
  google_fonts: ^6.2.1

  # Utils
  path_provider: ^2.1.3
  uuid: ^4.4.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/content/
    - assets/lottie/
    - assets/audio/
